name: Rebuild and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.147.8
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build with Hugo
        run: hugo --gc --minify --baseURL "https://lcy631zz.github.io/"
      - name: Copy built files to root
        run: |
          shopt -s extglob
          rm -rf !(config|content|themes|hugo.toml|.git|.gitignore|.github|archetypes|assets|data|i18n|layouts|static|resources)
      - name: Commit and push
        run: |
          git config --global user.email "lcy631zz@users.noreply.github.com"
          git config --global user.name "lcy631zz"
          git add -A
          git diff --cached --quiet && echo "No changes to deploy" && exit 0
          git commit -m "Rebuild site"
          git push
