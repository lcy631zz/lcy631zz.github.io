{{ define "main" }}
<div class="detail-page">
    <div class="detail-inner">
        <a href="/{{ .Section }}/" class="back-link">
            <span>←</span>
            {{ if eq .Section "blog" }}返回文章{{ else if eq .Section "projects" }}返回项目{{ else }}返回{{ end }}
        </a>
        <div class="detail-header">
            <h1 class="detail-title">{{ .Title }}</h1>
            <div class="detail-meta">
                <span>{{ .Date.Format "2006-01-02" }}</span>
                {{ if .Params.tags }}
                    {{ range .Params.tags }}
                        <span class="tag">{{ . }}</span>
                    {{ end }}
                {{ end }}
            </div>
        </div>
        <div class="detail-body">
            {{ .Content }}
        </div>
    </div>
</div>
{{ end }}
