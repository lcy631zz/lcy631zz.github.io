{{ define "main" }}
<section class="hero" id="hero">
    <canvas class="hero-canvas" id="cv"></canvas>
    <div class="hero-content">
        <div class="hero-badge" id="hBadge"></div>
        <h1 class="hero-title"><span id="hT1"></span><span class="hl" id="hTHL"></span><span id="hT2"></span><br><span id="hT3"></span><span class="hl" id="hTHL2"></span><span id="hT4"></span></h1>
        <p class="hero-sub" id="hSub"></p>
    </div>
    <div class="scroll-hint" id="scrollHint"><span id="sHint">向下探索</span><div class="arrow"></div></div>
</section>

<section class="section" style="padding-bottom:80px">
    <div class="section-inner">
        <div class="hub-grid">
            <a href="/about/" class="hub-card hub-red fi">
                <div class="hub-icon">👤</div>
                <h3 id="hubAboutTitle">我</h3>
                <p id="hubAboutDesc">关于我的介绍</p>
            </a>
            <a href="/blog/" class="hub-card hub-red fi">
                <div class="hub-icon">📝</div>
                <h3 id="hubArtTitle">文</h3>
                <p id="hubArtDesc">文学创作与思考</p>
            </a>
            <a href="/yin/" class="hub-card hub-green fi">
                <div class="hub-icon">🌿</div>
                <h3>荫</h3>
                <p>二次元照片收藏</p>
            </a>
            <a href="/xing/" class="hub-card hub-orange fi">
                <div class="hub-icon">✈️</div>
                <h3>行</h3>
                <p>旅行影像记录</p>
            </a>
            <a href="/projects/" class="hub-card hub-red fi">
                <div class="hub-icon">📁</div>
                <h3 id="hubProjTitle">项目</h3>
                <p id="hubProjDesc">我的项目作品</p>
            </a>
        </div>
    </div>
</section>
{{ end }}
