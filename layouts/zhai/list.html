{{ define "main" }}
<section class="page-section page-zhai">
    <div class="section-inner">
        <div class="page-divider"></div>
        <h1 class="page-title">摘</h1>
        <p class="page-desc" id="pageDesc">{{ i18n "zhai.desc" | default "读书摘抄，记录那些打动我的文字。" }}</p>

        <!-- Daily Quote -->
        <div class="zhai-daily-quote" id="zhaiDailyQuote">
            <div class="zdq-header">
                <span class="zdq-icon">📖</span>
                <span class="zdq-label" id="zdqLabel">{{ i18n "zhai_daily_label" | default "每日一摘" }}</span>
                <span class="zdq-date" id="zdqDate"></span>
            </div>
            <blockquote class="zdq-text" id="zdqText"></blockquote>
            <cite class="zdq-source" id="zdqSource"></cite>
        </div>

        <div class="zhai-list" id="zhaiList"></div>
    </div>
</section>
{{ end }}
