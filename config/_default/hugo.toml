# -- Site Configuration --

theme = "congo"
themePath = "themes/congo"

defaultContentLanguage = "zh-Hans"
defaultAppearance = "light"
autoSwitchAppearance = true

enableRobotsTXT = true
summaryLength = 0

[pagination]
  pagerSize = 15

[outputs]
  home = ["HTML", "RSS", "JSON"]

[privacy]
  [privacy.vimeo]
    enableDNT = true
  [privacy.x]
    enableDNT = true
  [privacy.youTube]
    privacyEnhanced = true
